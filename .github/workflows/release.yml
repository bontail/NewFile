name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version and tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 Config/version.py)"
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "v$version" ]]; then
            echo "::error::Tag must match VERSION: v$version"
            exit 1
          fi
      - name: Test, build, verify signature and package
        env:
          NEWFILE_BUILD_NUMBER: ${{ github.run_number }}
        run: bash package.sh
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NewFile-macOS-arm64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NewFile-macOS-arm64
          path: release
      - name: Publish tested archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum --check ./*.sha256
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its assets unchanged."
            exit 0
          fi
          printf '%s\n' \
            'macOS 13+ · Apple Silicon (arm64).' \
            '' \
            'Download the ZIP archive, extract it and move NewFile.app to Applications.' \
            'This build uses an ad-hoc signature and is not notarized by Apple.' \
            'See README for installation, Finder extension and Accessibility setup.' \
            > notes.md
          gh release create "$RELEASE_TAG" ./*.zip ./*.sha256 \
            --verify-tag --title "NewFile $RELEASE_TAG" \
            --notes-file notes.md --generate-notes
